name: Publish independent Market Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
permissions:
  contents: read
concurrency:
  group: market-atlas-pages
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.time.outputs.run }}
    steps:
      - id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node -e "const fs=require('fs');const offset=new Intl.DateTimeFormat('en',{timeZone:'Europe/Berlin',timeZoneName:'longOffset'}).formatToParts(new Date()).find(p=>p.type==='timeZoneName').value;const expected=offset==='GMT+02:00'?'0 5 * * *':'0 6 * * *';fs.appendFileSync(process.env.GITHUB_OUTPUT,'run='+(process.env.EVENT_NAME!=='schedule'||process.env.EVENT_SCHEDULE===expected)+'\n');"
  build:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      MARKET_ATLAS_FIREBASE_CONFIG: ${{ vars.MARKET_ATLAS_FIREBASE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install 'pypdf>=5,<7'
      - uses: actions/cache/restore@v4
        with:
          path: work/data
          key: market-atlas-data-${{ github.run_id }}
          restore-keys: market-atlas-data-
      - name: Authenticate protected archive reader
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: market-atlas-mw-20261118
          workload_identity_provider: projects/838142580310/locations/global/workloadIdentityPools/market-atlas-github/providers/github
          service_account: market-atlas-publisher@market-atlas-mw-20261118.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Recover last protected publication
        run: node scripts/restore-firebase-data.mjs
      - name: Download sources and retain historical observations
        run: node scripts/update-static-data.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:static
      - uses: actions/cache/save@v4
        with:
          path: work/data
          key: market-atlas-data-${{ github.run_id }}
      - name: Authenticate database publisher with short-lived GitHub identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: market-atlas-mw-20261118
          workload_identity_provider: projects/838142580310/locations/global/workloadIdentityPools/market-atlas-github/providers/github
          service_account: market-atlas-publisher@market-atlas-mw-20261118.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Publish protected data
        run: node scripts/publish-firebase-data.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
